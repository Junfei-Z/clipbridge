name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build native Mac menu bar app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm run build:mac
          plutil -lint dist/ClipBridge.app/Contents/Info.plist
          test -x dist/ClipBridge.app/Contents/MacOS/ClipBridge
          test -s dist/ClipBridge.app/Contents/Resources/node-path
